<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Didacticiel — Quiz Excel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f0f4ff;
    --surface: #ffffff;
    --surface2: #f5f7ff;
    --accent: #3b6ff0;
    --accent2: #6c47e8;
    --accent-light: #e8eefe;
    --text: #1a1f36;
    --muted: #7b8299;
    --border: #dde3f5;
    --radius: 12px;
    --font: 'Sora', sans-serif;
    --mono: 'Space Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
  }

  /* ── NAV ── */
  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 32px;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 6px rgba(60,80,180,0.06);
  }
  .nav-brand {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--accent);
    font-weight: 700;
    margin-right: auto;
    text-decoration: none;
  }
  .nav-brand span { color: var(--accent2); }
  .nav-links { display: flex; gap: 4px; }
  .nav-links a {
    text-decoration: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 8px;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .nav-links a:hover { background: var(--accent-light); color: var(--accent); }
  .nav-links a.active { background: var(--accent); color: #fff; }

  /* ── SCREENS ── */
  .screen {
    display: none;
    width: 100%;
    height: calc(100% - var(--nav-h, 60px));
    position: absolute;
    top: var(--nav-h, 60px); left: 0;
  }
  .screen.active { display: flex; }

  /* ── ENTRY SCREEN ── */
  #screen-entry {
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }

  .entry-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 44px 36px;
    width: 460px;
    max-width: 95vw;
    box-shadow: 0 2px 8px rgba(60,80,180,0.05);
    text-align: center;
  }

  /* Added missing style for badge */
  .entry-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--accent);
    background: var(--accent-light);
    padding: 4px 12px;
    border-radius: 99px;
    margin-bottom: 16px;
  }
  .entry-badge svg { stroke: var(--accent); }

  .entry-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 6px;
  }

  .entry-subtitle {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 32px;
  }

  .field-group {
    text-align: left;
    margin-bottom: 14px;
  }

  .field-group label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .field-group input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: var(--font);
    font-size: 14px;
    color: var(--text);
    background: var(--surface2);
    transition: border-color 0.2s;
    outline: none;
  }
  .field-group input::placeholder { color: var(--muted); }
  .field-group input:focus { border-color: var(--accent); background: var(--surface); }
  .field-group input.error { border-color: #dc2626; background: #fff5f5; }

  .error-msg {
    font-size: 12px;
    color: #dc2626;
    margin-top: 4px;
    display: none;
  }
  .error-msg.visible { display: block; }

  .btn-start {
    width: 100%;
    margin-top: 8px;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-start:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-start:active { transform: scale(0.98); }

  /* ── QUIZ SCREEN ── */
  #screen-quiz { flex-direction: column; background: var(--bg); }

  .quiz-subbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  
  /* Added missing header styles */
  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .student-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--accent-light);
    border-radius: 99px;
    padding: 4px 14px 4px 5px;
  }
  .student-avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .student-name { font-size: 13px; font-weight: 600; color: var(--accent); }
  .class-chip {
    font-size: 12px;
    color: var(--accent2);
    background: #ede8fd;
    padding: 3px 12px;
    border-radius: 99px;
    font-weight: 600;
  }

  .btn-export-sub {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
  }
  .btn-export-sub:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  .quiz-frame-wrapper { flex: 1; overflow: hidden; }
  .quiz-frame-wrapper iframe { width: 100%; height: 100%; border: none; display: block; }

  /* ── SUCCESS SCREEN ── */
  #screen-success {
    align-items: center;
    justify-content: center;
    background: rgba(240, 244, 255, 0.97);
    z-index: 10;
  }

  .success-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 44px 48px 36px;
    width: 420px;
    max-width: 94vw;
    text-align: center;
    box-shadow: 0 10px 32px rgba(60,80,180,0.10);
  }

  .score-ring {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: var(--accent-light);
    border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 22px;
  }
  .score-ring-inner {
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
  }

  .success-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .success-sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; line-height: 1.6; }

  .success-info-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .info-pill { font-size: 13px; padding: 4px 14px; border-radius: 99px; font-weight: 600; }
  .info-pill.name  { background: var(--accent-light); color: var(--accent); }
  .info-pill.classe { background: #ede8fd; color: var(--accent2); }

  .btn-dl {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-bottom: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-dl:hover { opacity: 0.88; transform: translateY(-1px); }

  .btn-logout {
    width: 100%;
    padding: 10px;
    background: transparent;
    color: var(--muted);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .btn-logout:hover { border-color: #dc2626; color: #dc2626; }

  .results-count { font-size: 12px; color: var(--muted); margin-top: 14px; }
  .results-count strong { color: var(--accent); }
</style>

<script src="SCORM_API_wrapper.js"></script>
<script>
/* ── SCORM ── */
var scorm = pipwerks ? pipwerks.SCORM : null;
window.onload = function(){
  if(scorm) scorm.init();
  var navH = document.querySelector("nav") ? document.querySelector("nav").offsetHeight : 52;
  document.documentElement.style.setProperty("--nav-h", navH + "px");
  showEntry();
};
window.onunload = function(){ if(scorm) scorm.quit(); };

/* ── STATE ── */
var studentName  = "";
var studentClass = "";
var finalScore   = 0;

/* ── SCREENS ── */
function showEntry() {
  setScreen("screen-entry");
}

function showQuiz() {
  // Update header
  document.getElementById("header-name").textContent = studentName;
  document.getElementById("header-class").textContent = studentClass;
  var initials = studentName.split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);
  document.getElementById("header-avatar").textContent = initials;
  setScreen("screen-quiz");
}

function showSuccess(score) {
  finalScore = score;
  document.getElementById("score-display").textContent = score + "%";
  document.getElementById("success-name").textContent  = studentName;
  document.getElementById("success-class").textContent = studentClass;
  setScreen("screen-success");
}

function setScreen(id) {
  document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
  document.getElementById(id).classList.add("active");
}

/* ── START SESSION ── */
function startSession() {
  var nomEl    = document.getElementById("nom");
  var classeEl = document.getElementById("classe");
  var nomErr   = document.getElementById("nom-err");
  var clsErr   = document.getElementById("classe-err");
  var ok = true;

  nomEl.classList.remove("error");
  classeEl.classList.remove("error");
  nomErr.classList.remove("visible");
  clsErr.classList.remove("visible");

  if (!nomEl.value.trim()) {
    nomEl.classList.add("error");
    nomErr.classList.add("visible");
    ok = false;
  }
  if (!classeEl.value.trim()) {
    classeEl.classList.add("error");
    clsErr.classList.add("visible");
    ok = false;
  }
  if (!ok) return;

  studentName  = nomEl.value.trim();
  studentClass = classeEl.value.trim();
  showQuiz();
}

/* ── SAVE SCORE ── */
var SHEET_URL = "https://script.google.com/macros/s/AKfycbz8MPLvIadVPsloNJEUXcKchXSdQJ08OTRNhgd0FGcyCGQeebafCtngYbmUXlfcdTjtfg/exec";

function saveScore(score) {
  var result = {
    nom:    studentName  || "Inconnu",
    classe: studentClass || "Inconnue",
    theme:  "Tableurs",
    score:  score,
    date:   new Date().toLocaleString("fr-FR")
  };

  fetch(SHEET_URL, {
    method: "POST",
    mode:   "no-cors",
    headers: { "Content-Type": "application/json" },
    body:   JSON.stringify(result)
  });

  return result;
}

/* ── LEARNINGAPPS MESSAGE ── */
window.addEventListener('message', function(e) {
  var a = (e.data && e.data.split) ? e.data.split("|") : [""];

  // Only save once, when the quiz is fully completed (AppSolved)
  if (a[0] === "AppSolved" && parseInt(a[a.length-1]) <= 2) {
    var score = parseInt(a[2]);
    saveScore(score);
    showSuccess(score);
  }
}, false);

/* ── LOGOUT → next student ── */
function logout() {
  studentName  = "";
  studentClass = "";
  // Clear form fields
  document.getElementById("nom").value    = "";
  document.getElementById("classe").value = "";
  // Reload the iframe so next student starts fresh
  var frame = document.getElementById("quiz-frame");
  frame.src = frame.src;
  // Back to entry screen
  setScreen("screen-entry");
  // Focus first field
  setTimeout(function(){ document.getElementById("nom").focus(); }, 100);
}

/* ── ENTER key on inputs ── */
document.addEventListener("DOMContentLoaded", function(){
  ["nom","classe"].forEach(function(id){
    document.getElementById(id).addEventListener("keydown", function(e){
      if (e.key === "Enter") startSession();
    });
  });
});
</script>
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html">didac<span>tiel</span></a>
  <div class="nav-links">
    <a href="index.html">🔍 Décodeur</a>
      <a href="glossaire.html" >📖 Glossaire</a>
    <a href="activity.html" >🎮 Activités</a>
      
    <a href="quiz.html" class="active"> Quiz</a>
  </div>
</nav>

<!-- ═══════════════════ ENTRY SCREEN ═══════════════════ -->
<div id="screen-entry" class="screen">
  <div class="entry-card">
    <div class="entry-badge">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6.5" stroke="#185FA5"/><path d="M4.5 7.5l2 2 3-4" stroke="#185FA5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Quiz interactif
    </div>
    <p class="entry-subtitle">Remplis tes informations pour commencer le quiz.</p>

    <div class="field-group">
      <label for="nom">Nom complet</label>
      <input type="text" id="nom" placeholder="Ex :Mohammed" autocomplete="off">
      <p class="error-msg" id="nom-err">Merci d'indiquer ton nom.</p>
    </div>

    <div class="field-group">
      <label for="classe">Classe</label>
      <input type="text" id="classe" placeholder="Ex : 2/4" autocomplete="off">
      <p class="error-msg" id="classe-err">Merci d'indiquer ta classe.</p>
    </div>

    <button class="btn-start" onclick="startSession()">Commencer le quiz →</button>
  </div>
</div>


<!-- ═══════════════════ QUIZ SCREEN ═══════════════════ -->
<div id="screen-quiz" class="screen" style="flex-direction:column;">
  <div class="quiz-header">
    <div class="quiz-header-info">
      <div class="student-chip">
        <div class="student-avatar" id="header-avatar">??</div>
        <span class="student-name" id="header-name">—</span>
      </div>
      <span class="class-chip" id="header-class">—</span>
    </div>
  </div>

  <div class="quiz-frame-wrapper">
    <iframe id="quiz-frame" src="https://learningapps.org/watch?v=pn53mkbu326"
            allow="fullscreen" loading="lazy"></iframe>
  </div>
</div>


<!-- ═══════════════════ SUCCESS SCREEN ═══════════════════ -->
<div id="screen-success" class="screen">
  <div class="success-card">
    <div class="score-ring">
      <span class="score-ring-inner" id="score-display">—</span>
    </div>
    <h2 class="success-title">Quiz terminé !</h2>
    <p class="success-sub"> Ton score a été enregistré </p>

    <div class="success-info-row">
      <span class="info-pill name" id="success-name">—</span>
      <span class="info-pill classe" id="success-class">—</span>
    </div>

    <button class="btn-logout" onclick="logout()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 2H2.5A1.5 1.5 0 001 3.5v7A1.5 1.5 0 002.5 12H5M9.5 10l2.5-3-2.5-3M12 7H5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Déconnexion — Élève suivant
    </button>
  </div>
</div>

</body>
</html>
