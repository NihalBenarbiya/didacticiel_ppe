<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Décodeur de consignes — Didacticiel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f4ff;
      --surface: #ffffff;
      --surface2: #f5f7ff;
      --accent: #3b6ff0;
      --accent2: #6c47e8;
      --accent-light: #e8eefe;
      --text: #1a1f36;
      --muted: #7b8299;
      --border: #dde3f5;
      --radius: 12px;
      --font: 'Sora', sans-serif;
      --mono: 'Space Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav (identical to activity.html) ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 32px;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 6px rgba(60,80,180,0.06);
    }

    .nav-brand {
      font-family: var(--mono);
      font-size: 15px;
      color: var(--accent);
      font-weight: 700;
      margin-right: auto;
      text-decoration: none;
    }
    .nav-brand span { color: var(--accent2); }

    .nav-links { display: flex; gap: 4px; }

    .nav-links a {
      text-decoration: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 8px;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-links a:hover { background: var(--accent-light); color: var(--accent); }
    .nav-links a.active { background: var(--accent); color: #fff; }

    /* ── Main layout ── */
    main {
      flex: 1;
      max-width: 760px;
      width: 100%;
      margin: 48px auto;
      padding: 0 24px;
    }

    .page-header { margin-bottom: 32px; }

    .page-header h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-header p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 14px;
    }

    /* ── Input card ── */
    .input-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 2px 8px rgba(60,80,180,0.05);
      margin-bottom: 24px;
    }

    .input-card label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    textarea {
      width: 100%;
      padding: 14px 16px;
      font-size: 14px;
      font-family: var(--font);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      resize: vertical;
      background: var(--surface2);
      color: var(--text);
      transition: border-color 0.18s, box-shadow 0.18s;
      outline: none;
      line-height: 1.6;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,111,240,0.12);
      background: var(--surface);
    }

    textarea::placeholder { color: var(--muted); }

    .btn-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 14px;
    }

    button {
      padding: 11px 24px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-family: var(--font);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(59,111,240,0.18);
    }

    button:hover:not(:disabled) {
      background: #2a5bda;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(59,111,240,0.28);
    }

    button:active:not(:disabled) { transform: translateY(0); }

    button:disabled {
      background: var(--border);
      color: var(--muted);
      cursor: not-allowed;
      box-shadow: none;
    }

    .loading-tag {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Result sections ── */
    #result { display: flex; flex-direction: column; gap: 14px; }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: 0 2px 8px rgba(60,80,180,0.05);
      animation: fadeUp 0.3s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .section-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .section h2 {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .section p, .section li {
      font-size: 14px;
      color: var(--text);
      line-height: 1.7;
    }

    /* Verbes */
    .verbes-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .verbe-chip {
      background: var(--accent-light);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
    }

    .verbe-chip strong {
      color: var(--accent);
      font-weight: 700;
    }

    .verbe-chip span { color: var(--muted); }

    /* Checklist */
    .checklist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .checklist li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .checklist input[type="checkbox"] {
      margin-top: 3px;
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Arabic */
    .arabic {
      direction: rtl;
      font-size: 17px;
      font-family: 'Segoe UI', 'Arabic', Arial, sans-serif;
      color: var(--text);
      line-height: 1.9;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
    }

    /* Error */
    .error-msg {
      background: #fff0f0;
      border: 1px solid #ffc0c0;
      border-radius: var(--radius);
      padding: 16px 20px;
      color: #c0392b;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-brand" href="index.html">didac<span>tiel</span></a>
    <div class="nav-links">
      <a href="index.html" class="active">🔍 Décodeur</a>
      <a href="activity.html">🎮 Activités</a>
      <a href="quiz.html">Quiz</a>
    </div>
  </nav>

  <main>
    <div class="page-header">
      <h1>🔍 Décodeur de consignes</h1>
      <p>Saisir une consigne d'informatique pour la simplifier, identifier les verbes d'action et obtenir les étapes à suivre.</p>
    </div>

    <div class="input-card">
      <label for="consigne">Consigne à analyser</label>
      <textarea id="consigne" rows="4" placeholder="Ex : Identifie et classe les différents types de fichiers présents dans le dossier…"></textarea>
      <div class="btn-row">
        <button onclick="decoder()" id="btn">
          🚀 Décoder la consigne
        </button>
        <div class="loading-tag" id="loading">
          <div class="spinner"></div>
          Analyse en cours…
        </div>
      </div>
    </div>

    <div id="result"></div>
  </main>

  <footer>Didacticiel · Informatique Collège · Maroc</footer>

  <script>
   const API_KEY = localStorage.getItem("groq_api_key") || "";

    async function decoder() {
      const consigne = document.getElementById("consigne").value.trim();
      if (!consigne) { alert("Écris d'abord une consigne !"); return; }

      const btn = document.getElementById("btn");
      const loading = document.getElementById("loading");

      btn.disabled = true;
      loading.style.display = "flex";
      document.getElementById("result").innerHTML = "";

      const prompt = `Tu es un assistant pédagogique pour élèves de collège au Maroc.
Analyse cette consigne d'informatique en français 
et réponds EXACTEMENT dans ce format JSON (sans texte avant ou après) :
{
  "verbes": [
    {
      "verbe": "...",
      "explication": "...",
      "traduction_ar": "..."
    }
  ],
  "checklist": ["...", "..."],
  "traduction": "..."
}

Règles :
- "verbes" : liste TOUS les verbes d'action présents dans la consigne (autant qu'il y en a, ni plus ni moins).
- "explication" : courte définition en français simple pour un élève de 12 ans.
- "traduction_ar" : traduction du verbe ET de son explication en arabe standard (الفصحى).
- "checklist" : décompose la consigne en étapes concrètes à réaliser (autant d'étapes que nécessaire).
- "traduction" : traduction complète de la consigne en arabe standard.

Consigne à analyser : "${consigne}"`;

      try {
        const response = await fetch("/api/decode", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ consigne })
});
const data = await response.json();
        if (!data.choices) throw new Error("Erreur API : " + JSON.stringify(data.error));

        const text = data.choices[0].message.content;
        const json = JSON.parse(text.replace(/```json|```/g, "").trim());
        afficherResultat(json);
      } catch (e) {
        document.getElementById("result").innerHTML =
          `<div class="error-msg">⚠️ Erreur : ${e.message}</div>`;
      }

      btn.disabled = false;
      loading.style.display = "none";
    }

    function afficherResultat(data) {
      const verbesHTML = data.verbes.map(v =>
  `<div class="verbe-chip">
    <strong>${v.verbe}</strong>
    <span>= ${v.explication}</span>
    <div class="arabic" style="font-size:13px; padding: 4px 8px; margin-top:6px;">${v.traduction_ar}</div>
  </div>`
).join("");

      const checklistHTML = data.checklist.map((e, i) =>
        `<li><input type="checkbox" id="step${i}"><label for="step${i}">${e}</label></li>`
      ).join("");

      document.getElementById("result").innerHTML = `
   

        <div class="section" style="animation-delay:0.07s">
          <div class="section-header">
            <div class="section-icon" style="background:#fef3e8">🔑</div>
            <h2>Verbes d'action</h2>
          </div>
          <div class="verbes-grid">${verbesHTML}</div>
        </div>

        <div class="section" style="animation-delay:0.14s">
          <div class="section-header">
            <div class="section-icon" style="background:#e8fef0">✅</div>
            <h2>Étapes à suivre</h2>
          </div>
          <ul class="checklist">${checklistHTML}</ul>
        </div>

        <div class="section" style="animation-delay:0.21s">
          <div class="section-header">
            <div class="section-icon" style="background:#f0e8fe">🌐</div>
            <h2>Traduction en arabe</h2>
          </div>
          <p class="arabic">${data.traduction}</p>
        </div>
      `;
    }
  </script>
</body>
</html>
